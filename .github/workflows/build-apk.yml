name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire Gip.zip
        run: unzip -o Gip.zip -d .

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Générer le wrapper Gradle
        working-directory: Gip
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew exécutable
        working-directory: Gip
        run: chmod +x gradlew

      - name: Compiler l'APK
        working-directory: Gip
        run: ./gradlew assembleDebug

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: gip-apk
          path: Gip/app/build/outputs/apk/debug/app-debug.apk
